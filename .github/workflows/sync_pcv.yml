name: 2. Sync PCV (09:15 น.)

on:
  schedule:
    - cron: '15 2 * * *' # 09:15 AM Thailand Time (UTC 02:15)
  workflow_dispatch:

concurrency:
  group: sync-pcv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: Connect to Thailand VPN
        run: |
          python vpn_connect.py

      - name: Run PCV Sync Script
        env:
          TZ: Asia/Bangkok
        run: |
          uv run sync_hdc_pcv.py
